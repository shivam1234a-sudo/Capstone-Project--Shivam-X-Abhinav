<html lang="en"><head>
  <title>Book Explorer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(to right, #667eea, #764ba2);
      color: white;
      text-align: center;
    }


    header {
      padding: 20px;
      font-size: 48px;
      font-weight: bold;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }


    #searchBox {
      margin: 30px;
    }

    input {
      padding: 12px;
      width: 250px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      background: #ff7a18;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
      transition: 0.3s;
    }

    button:hover {
      background: #ff3d00;
      transform: scale(1.05);
    }


    #container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
      padding: 20px;
    }


    .card {
      background: white;
      color: black;
      border-radius: 15px;
      padding: 15px;
      transition: 0.3s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    .card:hover {
      transform: translateY(-10px) scale(1.03);
    }

    img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
    }

    h3 {
      margin: 10px 0;
      font-size: 16px;
    }

    p {
      color: gray;
      font-size: 14px;
    }
    
    .no-results {
      font-size: 20px;
      margin-top: 20px;
    }
    #sortingButtons {
      display: flex;
      justify-content: right;
      margin-bottom: 20px;
    }
    .sort-button {
      padding: 10px 15px;
      border: none;
      border-radius: 25px;
      background: #4caf50;
      margin: 10px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>


  <header>📚 Book Explorer</header>


  <div id="searchBox">
    <input type="text" id="searchInput" placeholder="Search books...">
    <button onclick="searchBooks()">Search</button>
  </div>
  <div id="sortingButtons">
    <button class="sort-button" onclick="sortAZ()">Sort A-Z</button>
    <button class="sort-button" onclick="sortZA()">Sort Z-A</button>
  </div>
  <h2 style="text-align: left;">Recommendations:</h2>
  
  <div id="container"></div>

  <script src="script.js"></script>





</body></html>
