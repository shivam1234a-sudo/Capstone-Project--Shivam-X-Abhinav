<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Explorer</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(to right,#667eea,#764ba2);
color:white;
text-align:center;
}

header{
padding:20px;
font-size:48px;
font-weight:bold;
background:rgba(0,0,0,0.2);
}

#searchBox{
margin:30px;
}

input{
padding:12px;
width:250px;
border:none;
border-radius:25px;
outline:none;
}

button{
padding:12px 20px;
border:none;
border-radius:25px;
background:#ff7a18;
color:white;
font-weight:bold;
cursor:pointer;
margin-left:10px;
}

button:hover{
background:#ff3d00;
}

#sortingButtons{
display:flex;
justify-content:right;
margin:20px;
}

.sort-button{
background:#4caf50;
margin:10px;
}

#container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:25px;
padding:20px;
}

.card{
background:white;
color:black;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:10px;
}

.card h3{
margin:10px 0;
font-size:18px;
}

.card p{
color:gray;
margin:5px 0;
}
</style>

</head>

<body>

<header>📚 Book Explorer</header>

<div id="searchBox">
<input type="text" id="searchInput" placeholder="Search books...">
<button onclick="searchBooks()">Search</button>
</div>

<div id="sortingButtons">
<button class="sort-button" onclick="sortAZ()">Sort A-Z</button>
<button class="sort-button" onclick="sortZA()">Sort Z-A</button>
</div>

<h2 style="text-align:left; margin-left:20px;">Recommendations:</h2>

<div id="container"></div>

<script src="script.js"></script>

</body>
</html>
